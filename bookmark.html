<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - WebComics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
    <script src="js/profile-avatar.js" defer></script>
    <script src="js/bookmarks.js" defer></script>
    <script src="js/search.js" defer></script>
    <link rel="stylesheet" href="css/stylechapter.css">
</head>
<style>
    body {
        padding-top: 100px;
        background-color: #0f0e17;
    }

    .bookmark-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    .bookmark-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .bookmark-header h1 {
        font-size: 32px;
        color: #ff8906;
        margin-bottom: 10px;
    }

    .bookmark-header p {
        color: #7d82b5;
        font-size: 16px;
    }

    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        background-color: #2e2f3e;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
    }

    .bookmark-card-link {
        display: block;
        text-decoration: none;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.5);
    }

    .card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        display: block;
    }

    .card-info {
        padding: 15px;
    }

    .card-info h3 {
        font-size: 16px;
        color: #fffffe;
        margin-bottom: 5px;
    }

    .card-info p {
        font-size: 13px;
        color: #7d82b5;
    }

    .remove-bookmark {
        margin: 0 15px 15px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 137, 6, 0.3);
        border-radius: 6px;
        background: rgba(255, 137, 6, 0.12);
        color: #ffb454;
        font-weight: 700;
        cursor: pointer;
    }

    .remove-bookmark:hover {
        background: #ff8906;
        color: #121629;
    }

    .empty-message {
        text-align: center;
        color: #7d82b5;
        margin: 50px auto;
        font-size: 16px;
        grid-column: 1 / -1;
    }
</style>

<body>
    <header class="navbar">
        <a href="index.html" class="logo-link">
            <img src="img/image.png" alt="WebComics Logo" class="logo-img">
            <span class="logo">Web<span>Comics</span></span>
        </a>
        <nav class="nav-links">
            <a href="index.html#home"><img src="img/home.jpg"></a>

            <div class="dropdown" id="navDropdown">
                <button class="dropdown-btn" id="iconDropdownBtn" type="button">
                    <img src="img/menu.png" alt="Menu">
                </button>
                <div class="dropdown-content" id="iconDropdownContent">
                    <a href="bookmark.html">Bookmark</a>
                    <a href="profile1.html#section1">Contact</a>
                    <a href="register.html">Register</a>
                </div>
            </div>

            <a href="index.html#trending">Trending</a>
            <a href="categories.html">Categories</a>
            <a href="index.html#about">About</a>
        </nav>

        <a href="account.html" class="profile-icon-btn">
            <img id="navUserIcon" src="img/people.png" alt="Account">
        </a>
        
        <div class="search-container" id="searchContainer">
            <input type="text" placeholder="Search anime..." class="search-input" id="searchInput" autocomplete="off">
            <button class="search-btn" id="searchBtn">
                <img src="img/search.png" alt="Search">
            </button>
            <div class="search-dropdown" id="searchDropdown">
                <a href="bloodhaven.html" class="dropdown-item">Haven Ark: Devil's Blood</a>
                <a href="Forestconnect.html" class="dropdown-item">Forest Connect</a>
                <a href="ForestAlternate.html" class="dropdown-item">Connect Alternate World</a>
                <a href="mysterious.html" class="dropdown-item">Mysterious</a>
            </div>
        </div>
    </header>

    <main class="bookmark-container">
        <div class="bookmark-header">
            <h1>Your Bookmarks</h1>
            <p>Quick access to your saved comics and web novels</p>
        </div>

        <div class="cards-grid" id="bookmarkGrid" aria-live="polite"></div>
    </main>
    <script>
        const searchContainer = document.getElementById('searchContainer');
        const navDropdown = document.getElementById('navDropdown');

        searchContainer.addEventListener('click', function (e) {
            searchContainer.classList.toggle('active');
            navDropdown.classList.remove('active');
            e.stopPropagation();
        });

        navDropdown.addEventListener('click', function (e) {
            navDropdown.classList.toggle('active');
            searchContainer.classList.remove('active');
            e.stopPropagation();
        });

        document.addEventListener('click', function () {
            searchContainer.classList.remove('active');
            navDropdown.classList.remove('active');
        });
    </script>
</body>

</html>
