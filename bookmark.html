<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - WebComics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
    <script src="js/profile-avatar.js" defer></script>
    <script src="js/bookmarks.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/guest-access.js" defer></script>
    <link rel="stylesheet" href="css/stylechapter.css">
</head>
<style>
    body {
            background:
                radial-gradient(ellipse at 12% 18%, rgba(0, 136, 255, 0.09), transparent 32rem),
                radial-gradient(ellipse at 88% 46%, rgba(174, 0, 255, 0.055), transparent 30rem),
                #0f0e17;
        }

        .bookmark-container {
            width: min(1160px, calc(100% - 48px));
            margin: 0 auto;
            padding: 132px 0 72px;
        }

        .bookmark-header {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            margin-bottom: 36px;
            padding: clamp(28px, 5vw, 48px);
            border: 1px solid rgba(152, 177, 255, 0.12);
            border-radius: 22px;
            background:
                radial-gradient(ellipse at 90% 0%, rgba(255, 137, 6, 0.15), transparent 36%),
                linear-gradient(120deg, rgba(31, 39, 63, 0.96), rgba(22, 22, 39, 0.96));
            box-shadow: 0 20px 52px rgba(0, 0, 0, 0.2);
    }

        .bookmark-header::after {
            position: absolute;
            z-index: -1;
            top: -100px;
            right: -60px;
            width: 250px;
            height: 250px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.025), 0 0 0 64px rgba(255, 255, 255, 0.02);
            content: "";
            pointer-events: none;
        }

        .bookmark-eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            color: #ffb454;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .bookmark-header h1 {
            margin: 0 0 10px;
            color: #fffffe;
            font-size: clamp(2rem, 4.5vw, 3rem);
            line-height: 1.08;
            letter-spacing: -0.045em;
        }

        .bookmark-header p {
            max-width: 620px;
            margin: 0;
            color: #b5bfd6;
            font-size: 1rem;
            line-height: 1.65;
        }

        .bookmark-jumps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .bookmark-jumps a {
            display: inline-flex;
            min-height: 38px;
            align-items: center;
            padding: 8px 13px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 999px;
            background: rgba(14, 16, 27, 0.42);
            color: #e7eaf4;
            font-size: 0.83rem;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
        }

        .bookmark-jumps a:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 180, 84, 0.42);
            background: rgba(255, 137, 6, 0.12);
    }

        .bookmark-jumps a:focus-visible,
        .bookmark-card-link:focus-visible,
        .remove-bookmark:focus-visible {
            outline: 3px solid rgba(255, 180, 84, 0.8);
            outline-offset: 3px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 250px));
            gap: 18px;
    }

        .bookmark-section {
            margin-bottom: 28px;
            padding: clamp(20px, 3vw, 30px);
            border: 1px solid rgba(152, 177, 255, 0.1);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(24, 26, 43, 0.92), rgba(18, 20, 33, 0.96));
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.16);
            scroll-margin-top: 120px;
        }

        .bookmark-section h2 {
            margin: 0 0 20px;
            color: #fffffe;
            font-size: clamp(1.25rem, 2.6vw, 1.55rem);
            letter-spacing: -0.025em;
        }

        .card {
            position: relative;
            display: flex;
            min-width: 0;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(152, 177, 255, 0.1);
            border-radius: 15px;
            background: linear-gradient(145deg, #1c2031, #151725);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .bookmark-card-link {
            display: block;
            flex: 1 1 auto;
            color: inherit;
            text-decoration: none;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(113, 188, 255, 0.34);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            background: #20283a;
        }

        .card-info {
            display: flex;
            min-height: 108px;
            flex-direction: column;
            gap: 8px;
            padding: 14px;
        }

        .card-info h3 {
            margin: 0;
            color: #fffffe;
            font-size: 0.98rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .card-info p {
            margin: auto 0 0;
            color: #aeb8d2;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .remove-bookmark {
            align-self: flex-start;
            min-height: 36px;
            margin: 0 14px 14px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 137, 6, 0.28);
            border-radius: 9px;
            background: rgba(255, 137, 6, 0.1);
            color: #ffc078;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .remove-bookmark:hover {
            border-color: #ff8906;
            background: #ff8906;
            color: #121629;
        }

        .empty-message {
            grid-column: 1 / -1;
            margin: 0;
            padding: 24px;
            border: 1px dashed rgba(152, 177, 255, 0.18);
            border-radius: 14px;
            color: #9ea9c2;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 900px) {
            .bookmark-container {
                width: min(100% - 40px, 760px);
                padding-top: 142px;
            }
        }

        @media (max-width: 600px) {
            .bookmark-container {
                width: calc(100% - 28px);
                padding-top: 138px;
                padding-bottom: 48px;
            }

            .bookmark-header {
                margin-bottom: 22px;
                padding: 25px 21px;
                border-radius: 18px;
            }

            .bookmark-section {
                margin-bottom: 18px;
                padding: 18px 14px;
                border-radius: 17px;
            }

            .bookmark-section h2 {
                margin-bottom: 15px;
            }

            .cards-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .card-info {
                min-height: 102px;
                padding: 11px;
            }

            .card-info h3 {
                font-size: 0.9rem;
            }

            .remove-bookmark {
                margin: 0 11px 11px;
            }
        }
    </style>

<body>
    <header class="navbar">
        <a href="index.html" class="logo-link">
            <img src="img/image.png" alt="WebComics Logo" class="logo-img">
            <span class="logo">Web<span>Comics</span></span>
        </a>
        <nav class="nav-links">
            <a href="index.html#home"><img src="img/home.jpg"></a>

            <div class="dropdown" id="navDropdown">
                <button class="dropdown-btn" id="iconDropdownBtn" type="button">
                    <img src="img/menu.png" alt="Menu">
                </button>
                <div class="dropdown-content" id="iconDropdownContent">
                    <a href="bookmark.html">Bookmark</a>
                    <a href="profile1.html#section1">Contact</a>
                    <a href="register.html">Register</a>
                </div>
            </div>

            <a href="index.html#trending">Trending</a>
            <a href="categories.html">Categories</a>
            <a href="index.html#about">About</a>
        </nav>

        <a href="account.html" class="profile-icon-btn">
            <img id="navUserIcon" src="img/people.png" alt="Account">
        </a>
        
        <div class="search-container" id="searchContainer">
            <input type="text" placeholder="Search anime..." class="search-input" id="searchInput" autocomplete="off">
            <button class="search-btn" id="searchBtn">
                <img src="img/search.png" alt="Search">
            </button>
            <div class="search-dropdown" id="searchDropdown">
                <a href="bloodhaven.html" class="dropdown-item">Haven Ark: Devil's Blood</a>
                <a href="Forestconnect.html" class="dropdown-item">Forest Connect</a>
                <a href="ForestAlternate.html" class="dropdown-item">Connect Alternate World</a>
                <a href="mysterious.html" class="dropdown-item">Mysterious</a>
            </div>
        </div>
    </header>

    <main class="bookmark-container">
        <div class="bookmark-header">
            <span class="bookmark-eyebrow">YOUR PERSONAL LIBRARY</span>
            <h1>Your Bookmarks</h1>
            <p>Quick access to your saved comics and web novels</p>
            <nav class="bookmark-jumps" aria-label="Jump to saved stories">
                <a href="#comicBookmarks">Comics</a>
                <a href="#novelBookmarks">Web Novels</a>
            </nav>
        </div>

        <section class="bookmark-section" id="comicBookmarks" aria-labelledby="comicBookmarksHeading">
            <h2 id="comicBookmarksHeading">Comics</h2>
            <div class="cards-grid" id="comicBookmarkGrid" aria-live="polite"></div>
        </section>

        <section class="bookmark-section" id="novelBookmarks" aria-labelledby="novelBookmarksHeading">
            <h2 id="novelBookmarksHeading">Web Novels</h2>
            <div class="cards-grid" id="novelBookmarkGrid" aria-live="polite"></div>
        </section>
    </main>
    <script>
        const searchContainer = document.getElementById('searchContainer');
        const navDropdown = document.getElementById('navDropdown');

        searchContainer.addEventListener('click', function (e) {
            searchContainer.classList.toggle('active');
            navDropdown.classList.remove('active');
            e.stopPropagation();
        });

        navDropdown.addEventListener('click', function (e) {
            navDropdown.classList.toggle('active');
            searchContainer.classList.remove('active');
            e.stopPropagation();
        });

        document.addEventListener('click', function () {
            searchContainer.classList.remove('active');
            navDropdown.classList.remove('active');
        });
    </script>
</body>

</html>
